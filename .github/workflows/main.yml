# COMSATS workshop pipeline: https://admin.comsats.shakir.blog/guide.php
# Put your website files in the public/ folder of your repository.
#
# Required CI/CD variables (Settings -> CI/CD -> Variables):
#   SSH_PRIVATE_KEY  (type: File)      your private key, e.g. ~/.ssh/comsats_deploy
#   SSH_KNOWN_HOSTS  (type: Variable)  the server's host key line (see the guide)

variables:
  SITE_NAME: "alinaraza"                      # your website name / Linux username
  DEPLOY_HOST: "$SITE_NAME.comsats.shakir.blog"
  DEPLOY_PORT: "2280"
  DEPLOY_DIR: "/var/www/html/$SITE_NAME/"
  SOURCE_DIR: "public/"

stages:
  - test
  - scan
  - deploy

# 1. Fail the pipeline if any PHP file has a syntax error
php-lint:
  stage: test
  image: php:8.3-cli-alpine
  script:
    - echo "Checking PHP syntax in $SOURCE_DIR"
    - find "$SOURCE_DIR" -type f -name "*.php" -print0 | xargs -0 -r -n1 php -l

# 2. Fail the pipeline if ClamAV finds malware
virus-scan:
  stage: scan
  image: alpine:3.20
  before_script:
    - apk add --no-cache clamav clamav-libunrar
    - freshclam --quiet --stdout || freshclam --stdout
  script:
    - clamscan --recursive --infected --max-filesize=50M --max-scansize=200M "$SOURCE_DIR"

# 3. Upload public/ to the server over SSH (only from the default branch)
deploy:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # Write the key to a file without ever passing it as a command argument,
    # so it can never be printed in the job log. Works for File and Variable types.
    - |
      if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY is empty. Add it in Settings > CI/CD > Variables (protected variables only work on protected branches)."
        exit 1
      fi
      umask 077
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        { tr -d '\r' < "$SSH_PRIVATE_KEY"; echo; } > ~/.ssh/id_deploy
      else
        printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
      fi
      if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
        echo "ERROR: SSH_PRIVATE_KEY is not a valid private key without passphrase. Copy the whole file including the BEGIN/END lines."
        exit 1
      fi
      if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
        echo "ERROR: SSH_KNOWN_HOSTS is empty. Copy it from your status page."
        exit 1
      fi
      printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - rsync -rlvz --delete --chmod=D2750,F640 -e "ssh -p $DEPLOY_PORT -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes" "$SOURCE_DIR" "$SITE_NAME@$DEPLOY_HOST:$DEPLOY_DIR"
  after_script:
    - rm -f ~/.ssh/id_deploy
  environment:
    name: production
    url: https://alinaraza.comsats.shakir.blog
